    - source: "Ireland-Rosen, Proposition 17.3.1 (Legendre)"
      lean: "NTKB.Headlines.IrelandRosen.legendre"
      module: "Challenge_IrelandRosen / Solution_IrelandRosen"
      status: "proved"
    - source: "Ireland-Rosen, Proposition 17.4.1 (Sophie Germain)"
      lean: "NTKB.Headlines.IrelandRosen.sophie_germain"
