    - source: "Washington, Theorem 4.2"
      lean: "NTKB.Headlines.SpecialValues.LFunction_one_sub_nat"
      module: "Challenge_SpecialValues / Solution_SpecialValues"
      status: "proved"
    - source: "Washington, Chapter 4 (L(k, chi) for primitive chi) [locator unverified]"
      lean: "NTKB.Headlines.SpecialValues.LFunction_natCast"
      module: "Challenge_SpecialValues / Solution_SpecialValues"
